<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비공개 영역</title>
<script src="/vendor/simplewebauthn-browser.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 20px;color:#17241F;}
  h1{font-size:22px;}
  h2{font-size:15px;margin-top:32px;border-bottom:1px solid #ddd;padding-bottom:6px;}
  .item{background:#F4F5F0;border-radius:8px;padding:12px 14px;margin-bottom:8px;}
  .item h3{margin:0 0 4px;font-size:14px;}
  .item p{margin:0;font-size:13px;color:#44544B;}
  .topbar{display:flex;justify-content:space-between;align-items:center;}
  button, a.btn{background:#17241F;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;}
  .passkey-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:13px;}
  .del{background:#a33;padding:4px 10px;font-size:12px;}
  #gate{font-size:14px;}
</style>
</head>
<body>
  <div id="gate">확인 중...</div>

  <div id="app" style="display:none;">
    <div class="topbar">
      <h1>비공개 영역</h1>
      <button id="logoutBtn">로그아웃</button>
    </div>
    <p id="whoami" style="color:#44544B;font-size:13px;"></p>

    <div id="contentSections"></div>

    <h2>등록된 패스키</h2>
    <div id="passkeyList"></div>
    <p><a class="btn" href="/register.html">+ 새 패스키 등록하기</a></p>
  </div>

  <script>
    const { startAuthentication } = SimpleWebAuthnBrowser;

    async function api(path, opts) {
      const res = await fetch(path, { credentials: 'same-origin', ...opts });
      if (res.status === 401) {
        window.location.href = '/login.html';
        throw new Error('unauthenticated');
      }
      return res;
    }

    async function loadWhoAmI() {
      const res = await api('/api/whoami');
      const data = await res.json();
      document.getElementById('whoami').textContent = `${data.username}(으)로 로그인됨`;
    }

    async function loadContent() {
      const res = await api('/api/private/content');
      const data = await res.json();
      const container = document.getElementById('contentSections');
      container.innerHTML = '';
      for (const [key, label] of Object.entries(data.labels)) {
        const items = data.content[key] || [];
        const section = document.createElement('div');
        section.innerHTML = `<h2>${label}</h2>` + items.map(i =>
          `<div class="item"><h3>${i.title}</h3><p>${i.body}</p></div>`
        ).join('') || '<p style="color:#999;font-size:13px;">아직 없음</p>';
        container.appendChild(section);
      }
    }

    async function loadPasskeys() {
      const res = await api('/api/private/passkeys');
      const data = await res.json();
      const list = document.getElementById('passkeyList');
      list.innerHTML = data.passkeys.map(p => `
        <div class="passkey-row" data-id="${p.id}">
          <span>${p.device_name} — ${new Date(p.created_at).toLocaleDateString('ko-KR')}</span>
          <button class="del" data-id="${p.id}">삭제</button>
        </div>
      `).join('');
      list.querySelectorAll('.del').forEach(btn => {
        btn.addEventListener('click', async () => {
          const row = btn.closest('.passkey-row');
          if (btn.dataset.confirming !== 'yes') {
            btn.dataset.confirming = 'yes';
            btn.textContent = '정말 삭제?';
            setTimeout(() => { if (btn.dataset.confirming === 'yes') { btn.dataset.confirming = 'no'; btn.textContent = '삭제'; } }, 3000);
            return;
          }
          const res = await api('/api/private/passkeys/' + btn.dataset.id, { method: 'DELETE' });
          const data = await res.json();
          const status = document.createElement('span');
          status.style.cssText = 'font-size:12px;color:#8C6A1F;display:block;margin-top:4px;';
          status.textContent = `삭제됨. 남은 패스키: ${data.remainingPasskeys}개`;
          row.replaceWith(status);
        });
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    (async () => {
      try {
        await loadWhoAmI();
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        await loadContent();
        await loadPasskeys();
      } catch (e) {
        // loadWhoAmI가 401이면 이미 /login.html로 리다이렉트됨
      }
    })();
  </script>
</body>
</html>
