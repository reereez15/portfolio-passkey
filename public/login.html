<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>패스키 로그인</title>
<script src="/vendor/simplewebauthn-browser.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:420px;margin:60px auto;padding:0 20px;color:#17241F;}
  h1{font-size:20px;}
  input{width:100%;padding:10px;margin:6px 0 16px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;}
  button{width:100%;padding:12px;background:#17241F;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;}
  #msg{margin-top:16px;font-size:13px;white-space:pre-wrap;}
  a{color:#8C6A1F;}
</style>
</head>
<body>
  <h1>패스키로 로그인</h1>

  <label>아이디</label>
  <input id="username" placeholder="예: kimjunsik">

  <button id="loginBtn">패스키로 로그인</button>
  <div id="msg"></div>

  <p style="margin-top:24px;"><a href="/register.html">아직 등록 안 했다면 등록하기 →</a></p>

  <script>
    const { startAuthentication } = SimpleWebAuthnBrowser;
    const msg = document.getElementById('msg');

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const btn = document.getElementById('loginBtn');
      if (btn.disabled) return;

      const username = document.getElementById('username').value.trim();
      if (!username) { msg.textContent = '아이디를 입력해주세요.'; return; }

      btn.disabled = true;
      msg.textContent = '로그인 요청 중...';
      try {
        const optRes = await fetch('/api/login/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const optData = await optRes.json();
        if (!optRes.ok) throw new Error(optData.message || optData.error);

        const authResp = await startAuthentication({ optionsJSON: optData.options });

        const verifyRes = await fetch('/api/login/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, response: authResp }),
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok || !verifyData.verified) throw new Error(verifyData.message || '로그인 실패');

        window.location.href = '/private.html';
      } catch (err) {
        msg.textContent = '오류: ' + err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
